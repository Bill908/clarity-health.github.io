name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update npm
        run: npm install -g npm@11.6.0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        # If your project is in a subfolder (e.g., 'app'), uncomment the next line:
        # working-directory: ./app
        run: npm install

      - name: Build website
        # working-directory: ./app
        run: npm run build

      - name: Add Android platform (if missing)
        # working-directory: ./app
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android directory already exists, skipping cap add."
          fi

      - name: Sync Android project
        # working-directory: ./app
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        # working-directory: ./app
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        # If in a subfolder, use: working-directory: ./app/android
        run: ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          # If in a subfolder, use: path: app/android/app/build/outputs/apk/debug/*.apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Android app build ${{ github.run_number }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/*.apk
