name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json' # ✅ Point to your lockfile

      - name: Update npm
        run: npm install -g npm@11.6.0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci
        working-directory: app # ✅ Run install inside the correct directory

      - name: Build website
        run: npm run build
        working-directory: app

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android directory already exists, skipping cap add."
          fi
        working-directory: app

      - name: Sync Android project
        run: npx cap sync android
        working-directory: app

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
        working-directory: app

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
